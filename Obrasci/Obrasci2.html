<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Registracija Učenika</h1>
  <form action="">

  <label for="sifra">Šifra učenika: </label>
  <input type="text" name="sifra1" id="sifra"> <br>

  <label for="imeiprezimme">Ime učenika: </label>
  <input type="text" name="naziv" id="imeiprezimme"> <br>

  <label for="imeoca">Ime oca: </label>
  <input type="text" name="otac" id="imeoca"> <br>

  <label for="datum">Datum rođenja: </label>
  <input type="date" name="datum1" id="datum"> <br>

  <label for="mob">Broj mobitela: </label>
  <input type="tel" name="mobitel1" id="mob"> <br>

  <label for="mail">Email adresa: </label>
  <input type="email" name="maila" id="mail"> <br>

  <label for="lozinka">lozinka: </label>
  <input type="password" name="loz" id="lozinka"> <br>

  <label >Spol: </label>
  <input type="radio" name="spolz" id="spolm">
  <label for="spolm">Muško</label>
  <input type="radio" name="spolz" id="spolz" >
  <label for="spolz">Žensko</label> <br>

  <label >Škola: </label>
  <input type="checkbox" name="škola1" id="gmm">
  <label for="gmm">Gimnazija Matije Mesić</label>

  <input type="checkbox" name="škola2" id="tssb">
  <label for="tssb">Tehnička škola Slavonski Brod</label>

  <input type="checkbox" name="škola3" id="otšsb">
  <label for="otšsb">Obrtničko Tehnička škola Slavonski Brod</label>

  <input type="checkbox" name="škola4" id="kgfml">
  <label for="kgfml">Klasična gimnazija Fra Marijana Lanosovića</label> <br>

  <label >Smjerovi: </label>
  <select name="smjerovi" id="smjerovi1">
    <option value="Strojarski računalni tehničar">Strojarski računalni tehničar</option>
    <option value="Tehničar za računalstvo"> Tehničar za računalstvo</option>
    <option value="Tehničar za logistiku i špediciju" id="špediter">Tehničar za  logistiku i špediciju</option>
    <option value="Arhitekti" id="Arhitekt">Arhitekti</option>
  </select> <br>
  <label for="grad">Grad: </label>
  <input type="text" name="grad1" id="grad"> <br>
  <textarea name="adresa" id="adresa1">Adresa</textarea> <br>

  <label for="slika">Slika: </label>
  <input type="file" name="dat" id="slika"> <br>

  <input type="submit"  value="Registriraj se" id="reg">




</form>
</body>
</html>
